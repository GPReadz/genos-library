<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geno's Library</title>
<meta name="theme-color" content="#14100d">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Geno's Library">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: a walnut library; the main shelf is one tall bookcase of every TBR spine, genre shelves are niches tinted with the sheet's jewel-tone genre colors */
  --ink:#14100d;
  --panel:#1f1914;
  --raise:#2a221b;
  --line:#3e3329;
  --text:#f3ece2;
  --muted:#b4a796;
  --accent:#d8b36a;
  --wood:#4a3220;
  --wood-dark:#2c1d12;
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none !important}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 20px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 20px}
.brand{font-family:var(--display);font-size:30px;line-height:1;margin:0 auto 12px 0}
.brand small{display:block;font-family:var(--body);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.tabs{display:flex;gap:2px;order:3;width:100%;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-current="page"]{color:var(--text);border-bottom-color:var(--accent)}
.actions{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.sync{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--raise);padding:9px 14px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);color:#22180c;border-color:var(--accent)}
.btn.ghost{background:none}
.btn.small{padding:6px 10px;font-size:14px}
.btn.danger{color:#ffb3b3}
main{max-width:1240px;margin:0 auto;padding:22px 20px 80px}
.banner{background:#33281b;border:1px solid #67512f;color:#f1dfc2;padding:12px 14px;border-radius:8px;margin-bottom:18px;font-size:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.view-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.view-head h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 220px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
select.sel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.linkish{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0}
.hidden-note{font-size:14px;color:var(--muted)}

/* spines */
.spine{flex:none;height:var(--h,230px);border:0;padding:0;background:none;position:relative;transition:transform .18s ease;transform-origin:bottom center;border-radius:2px 2px 0 0;box-shadow:2px 0 4px rgba(0,0,0,.4)}
.spine:hover,.spine:focus-visible{transform:translateY(-8px)}
.spine img{display:block;width:100%;height:100%;object-fit:cover;border-radius:2px 2px 0 0}
.spine.blank{--g:#7a6a5a;--sg:var(--g);color:#f7efe1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 0 14px;
  background:linear-gradient(90deg,rgba(0,0,0,.30),rgba(255,255,255,.13) 20%,rgba(255,255,255,0) 46%,rgba(0,0,0,.24)),var(--sg)}
.spine.blank.b1{background:linear-gradient(180deg,transparent 0 10px,rgba(238,212,150,.75) 10px 12px,transparent 12px 15px,rgba(238,212,150,.75) 15px 16px,transparent 16px calc(100% - 16px),rgba(238,212,150,.75) calc(100% - 16px) calc(100% - 15px),transparent calc(100% - 15px) calc(100% - 12px),rgba(238,212,150,.75) calc(100% - 12px) calc(100% - 10px),transparent calc(100% - 10px)),linear-gradient(90deg,rgba(0,0,0,.30),rgba(255,255,255,.13) 20%,rgba(255,255,255,0) 46%,rgba(0,0,0,.24)),var(--sg)}
.spine.blank.b2{background:linear-gradient(180deg,transparent 0 calc(100% - 46px),rgba(0,0,0,.32) calc(100% - 46px)),linear-gradient(90deg,rgba(0,0,0,.30),rgba(255,255,255,.13) 20%,rgba(255,255,255,0) 46%,rgba(0,0,0,.24)),var(--sg)}
.spine.blank.b3{background:linear-gradient(180deg,rgba(255,255,255,.16) 0 30px,transparent 30px),linear-gradient(90deg,rgba(0,0,0,.30),rgba(255,255,255,.13) 20%,rgba(255,255,255,0) 46%,rgba(0,0,0,.24)),var(--sg)}
.spine.blank .t{writing-mode:vertical-rl;font-family:var(--display);font-size:14px;text-shadow:0 1px 1px rgba(0,0,0,.35);line-height:1.05;max-height:calc(var(--h,230px) - 90px);overflow:hidden;text-align:center}
.spine.blank .a{writing-mode:vertical-rl;font-size:9px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;max-height:50px;overflow:hidden}
.spine .badge{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.4)}

/* main bookcase */
.case{--h:200px;--wall:#241a12;position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;gap:26px 2px;padding:16px 18px 26px;border-radius:12px;
  background:
    repeating-linear-gradient(180deg,transparent 0 var(--h),var(--wood) var(--h) calc(var(--h) + 6px),var(--wood-dark) calc(var(--h) + 6px) calc(var(--h) + 14px),transparent calc(var(--h) + 14px) calc(var(--h) + 26px)) 0 16px / 100% calc(100% - 16px) no-repeat,
    radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--wall) 70%,#fff 6%),transparent 70%),
    var(--wall);
  border:10px solid var(--wood-dark);box-shadow:inset 0 0 30px rgba(0,0,0,.55)}
.case.tinted{--wall:color-mix(in srgb,var(--c) 55%,#0d0907)}
.more{display:flex;justify-content:center;margin-top:16px;gap:10px;align-items:center;color:var(--muted);font-size:14px}

/* genre shelves */
.shelf{--c:#7a6a5a;margin-bottom:34px}
.shelf-head{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.plaque{font-family:var(--display);font-weight:400;font-size:22px;margin:0;display:flex;align-items:center;gap:10px}
.plaque::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--c);flex:none}
.rule,.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.shelf-head .right{margin-left:auto;display:flex;gap:6px}
.niche{--h:230px;position:relative;border-radius:10px 10px 0 0;padding:22px 18px 0;min-height:262px;display:flex;align-items:flex-end;gap:2px;overflow-x:auto;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--c) 75%,#fff 10%) 0%,transparent 70%),linear-gradient(180deg,color-mix(in srgb,var(--c) 60%,#0d0907) 0%,color-mix(in srgb,var(--c) 85%,#0d0907) 100%);
  box-shadow:inset 0 14px 22px rgba(0,0,0,.4),inset 12px 0 18px rgba(0,0,0,.2),inset -12px 0 18px rgba(0,0,0,.2)}
.ledge{height:16px;border-radius:0 0 6px 6px;background:linear-gradient(180deg,var(--wood),var(--wood-dark));box-shadow:0 10px 18px rgba(0,0,0,.5)}
.empty-shelf{align-self:center;margin:auto;color:#fff;opacity:.8;font-size:14px;text-align:center;padding-bottom:28px;max-width:30ch}
.seeall{flex:none;align-self:center;margin:0 8px 40px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:10px 12px;font-weight:600;font-size:14px}

/* read */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.reviews{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.rcard{--c:#7a6a5a;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:16px;display:grid;grid-template-columns:96px 1fr;gap:16px}
.thumb{width:96px;height:144px;border-radius:4px;overflow:hidden;background:color-mix(in srgb,var(--c) 75%,#0d0907);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-size:13px;padding:6px;color:#fff;border:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb:has(img){padding:0}
.cover:has(img){padding:0}
.rcard h3{font-family:var(--display);font-weight:400;font-size:20px;margin:0;text-wrap:balance}
.rcard .by{color:var(--muted);font-size:14px;margin:2px 0 8px}
.rcard .rev{font-size:14px;color:#e6dccd;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin:8px 0 12px;white-space:pre-line}
.meta{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--display);font-weight:400;color:var(--text);margin:0 0 6px}
.empty .btn{margin-top:10px}

/* all books */
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.list{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:14px}
.lrow{display:grid;grid-template-columns:14px minmax(0,2fr) minmax(0,1.3fr) 90px 80px;gap:12px;align-items:center;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:var(--panel);width:100%;text-align:left}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--raise)}
.dot{width:12px;height:12px;border-radius:3px}
.ti{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.au{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);justify-self:start;white-space:nowrap}
.pill.read{background:#2b3a26;border-color:#4a6342;color:#cfe6c8}
.pill.reading{background:#3d321c;border-color:#6d5a31;color:#f1ddb0}
.pill.dnf{background:#3d2424;border-color:#6b3b3b;color:#f0c0c0}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(8,6,4,.75);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(760px,100%);padding:22px}
.modal h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--text);font-weight:400;font-size:15px}
.f textarea{min-height:120px;resize:vertical}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:18px;align-items:center}
.foot .left{margin-right:auto}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ph{background:var(--ink);border:1px dashed var(--line);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:flex-start}
.ph .pv{width:58px;height:120px;flex:none;border-radius:3px;background:var(--raise);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center}
.ph .pv.cv{width:80px}
.ph .pv img{width:100%;height:100%;object-fit:cover}
.ph .ctl{display:flex;flex-direction:column;gap:6px;font-size:13px}
.rating{display:flex;align-items:center;gap:10px}
.starbox{cursor:pointer;touch-action:manipulation}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:30px;height:30px;border-radius:6px;border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--text)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;font-size:14px;background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.err{color:#ffb3b3;font-size:14px}

/* detail */
.detail{--c:#7a6a5a;display:grid;grid-template-columns:210px minmax(0,1fr);gap:22px}
.cover{width:210px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.5);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 85%,#fff 10%),color-mix(in srgb,var(--c) 70%,#0d0907));display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:18px;color:#fff}
.cover img{width:100%;height:100%;object-fit:cover}
.cover .ct{font-family:var(--display);font-size:22px;line-height:1.1}
.cover .ca{font-size:13px;margin-top:10px;opacity:.85}
.cover-note{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}
.detail h2{margin:0}
.detail .by{color:var(--muted);margin:4px 0 12px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin:14px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{min-width:0}
.facts dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.facts dd{margin:2px 0 0;font-size:15px;font-variant-numeric:tabular-nums}
.facts .wide{grid-column:1/-1}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tchip{font-size:13px;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 35%,var(--raise));border:1px solid color-mix(in srgb,var(--c) 60%,var(--line))}
.syn{font-size:15px;line-height:1.6;color:#e9e0d2;max-width:65ch;white-space:pre-line}
.syn-h{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 6px}
.post-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.post-wrap canvas{width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.progress{height:8px;border-radius:99px;background:var(--raise);overflow:hidden;margin:12px 0}
.progress span{display:block;height:100%;background:var(--accent);width:0}

/* rooms */
.rooms{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;margin-bottom:12px;order:2}
.room{background:none;border:0;border-radius:999px;padding:7px 14px;font-weight:600;color:var(--muted);font-size:14px}
.room[aria-current="page"]{background:var(--accent);color:#22180c}
@media (max-width:640px){.rooms{order:3;width:100%;justify-content:center}.tabs{order:4}}

/* VHS */
.case.vhs{--h:206px;--wall:#1b1720}
.tape{--g:#5b5650;flex:none;width:36px;height:var(--h,206px);border:0;padding:6px 4px;position:relative;border-radius:2px;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:repeating-linear-gradient(180deg,#1c1b1d 0 3px,#151416 3px 6px);box-shadow:inset 1px 0 0 #2e2c30,inset -1px 0 0 #0a0a0b,2px 0 4px rgba(0,0,0,.5);transition:transform .18s ease,filter .12s ease}
.tape.box{width:44px;background:linear-gradient(90deg,#d8d2c6,#efe9de 30%,#d8d2c6);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15),2px 0 4px rgba(0,0,0,.5)}
.tape:hover,.tape:focus-visible{transform:translateY(-8px)}
.tape .lab{flex:1;width:100%;background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(255,255,255,.12) 30%,rgba(255,255,255,0) 60%,rgba(0,0,0,.15)),var(--g);border-top:10px solid #f1ece2;border-radius:1px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px 0}
.tape.box .lab{background:var(--g);border-top-color:rgba(0,0,0,.25)}
.tape .tt{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-size:13px;line-height:1.05;color:#f7efe1;text-shadow:0 1px 1px rgba(0,0,0,.35);max-height:100%;text-align:center}
.tape.box .tt{color:#fff}
.tape .ty{font-size:8px;letter-spacing:.14em;font-weight:700;color:#9b968e}
.tape.box .ty{color:#4a443c}
.tape .badge{top:auto;bottom:22px}
.poster{border:0;padding:0;width:100%;aspect-ratio:2/3;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#fff;
  background:radial-gradient(90% 60% at 30% 25%,color-mix(in srgb,var(--c,#5b5650) 60%,#fff 25%),transparent 70%),linear-gradient(170deg,var(--c,#5b5650),color-mix(in srgb,var(--c,#5b5650) 45%,#050304));box-shadow:0 10px 24px rgba(0,0,0,.45)}
.poster img{width:100%;height:100%;object-fit:cover}
.poster .pz-top,.poster .pz-bot{font-size:10px;letter-spacing:.16em;font-weight:700;padding:12px;opacity:.85}
.poster .pz-title{font-family:var(--display);font-size:22px;line-height:1.05;padding:0 12px;text-wrap:balance}
.poster.big{width:210px}
.poster.big .pz-title{font-size:28px}
.posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pcard{--c:#5b5650;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:96px 1fr;gap:14px}
.pcard h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0;text-wrap:balance}
.pcard .rev{font-size:14px;color:#e6dccd;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin:8px 0 10px}
.pcard .poster .pz-title{font-size:14px;padding:0 8px}.pcard .poster .pz-top,.pcard .poster .pz-bot{font-size:8px;padding:8px}

/* records */
.wall{--h:150px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:30px 52px;padding:18px 70px 30px 18px;border-radius:10px;
  background:repeating-linear-gradient(180deg,transparent 0 var(--h),var(--wood) var(--h) calc(var(--h) + 6px),var(--wood-dark) calc(var(--h) + 6px) calc(var(--h) + 13px),transparent calc(var(--h) + 13px) calc(var(--h) + 30px)) 0 18px / 100% calc(100% - 18px) no-repeat,
  radial-gradient(100% 80% at 50% 0%,color-mix(in srgb,var(--c) 22%,#241c16),#18130f)}
.lp{--g:#66605a;position:relative;width:var(--h);height:var(--h);flex:none;border:0;padding:0;background:none}
.disc{position:absolute;top:4%;left:30%;width:92%;height:92%;border-radius:50%;z-index:1;transition:left .35s cubic-bezier(.2,.8,.3,1);
  background:conic-gradient(from 30deg,transparent 0 10%,rgba(255,255,255,.10) 14%,transparent 20% 55%,rgba(255,255,255,.07) 60%,transparent 66%),repeating-radial-gradient(circle,#121212 0 2px,#1f1f1f 2px 3px);box-shadow:0 4px 10px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.12)}
.disc .lbl{position:absolute;inset:32%;border-radius:50%;background:var(--g) center/cover;box-shadow:0 0 0 2px rgba(0,0,0,.4)}

  background:radial-gradient(70% 70% at 75% 30%,color-mix(in srgb,var(--g) 55%,#fff 30%),transparent 60%),linear-gradient(160deg,var(--g),color-mix(in srgb,var(--g) 40%,#060404));box-shadow:0 8px 16px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.08)}

  background:radial-gradient(70% 70% at 75% 30%,color-mix(in srgb,var(--g) 55%,#fff 30%),transparent 60%),linear-gradient(160deg,var(--g),color-mix(in srgb,var(--g) 40%,#060404));box-shadow:0 6px 14px rgba(0,0,0,.5)}

/* picker stages */

/* account, settings, toast */

body[data-room="auth"] .actions .btn,body[data-room="auth"] .rooms{visibility:hidden}

/* next-read picker */
.picker-filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
.hat{font-size:14px;color:var(--muted);margin:12px 0 0;font-variant-numeric:tabular-nums}

  background:radial-gradient(120% 70% at 50% 0%,#3a2a1c,transparent 70%),#241a12;border:8px solid var(--wood-dark);border-bottom:0}

.stage .spine.lit{filter:brightness(1.15);transform:translateY(-10px)}
.stage .spine.pulled{filter:brightness(1.2);transform:translateY(-34px) rotate(-4deg);transition:transform .5s cubic-bezier(.2,.9,.3,1.2)}
.stage .spine.dim{filter:brightness(.45)}
.stage-empty{align-self:center;margin:auto;color:var(--muted);font-size:14px;padding-bottom:24px;text-align:center}
.pick{--c:#7a6a5a;display:grid;grid-template-columns:140px minmax(0,1fr);gap:18px;margin-top:16px;padding:16px;border-radius:12px;background:color-mix(in srgb,var(--c) 18%,var(--raise));border:1px solid color-mix(in srgb,var(--c) 50%,var(--line));animation:rise .45s ease both}

.pick .syn{font-size:14px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin:8px 0 0}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (max-width:640px){
  .picker-filters{grid-template-columns:1fr 1fr}
  .stage{--h:130px;min-height:160px}
  .pick{grid-template-columns:1fr}
  .pick .cover{width:130px;margin:0 auto}
  .lrow{grid-template-columns:14px minmax(0,1fr) auto}

@media (prefers-reduced-motion:reduce){.spine{transition:none}.spine:hover{transform:none}}

<body>
<header class="top">
  <div class="top-in">
    <p class="brand">Geno's Library<small>Books · Movies &amp; Shows · Music</small></p>
    <div class="actions">
      <span class="sync" id="sync">Connecting…</span>
      <button class="btn primary" id="addBook" type="button">+ Add book</button>
      <a class="btn ghost icon" href="#settings" aria-label="Settings" title="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
    </div>
    <nav class="rooms" aria-label="Rooms">
      <button class="room" data-room="books" type="button">Books</button>
      <button class="room" data-room="watch" type="button">Watch</button>
      <button class="room" data-room="listen" type="button">Listen</button>
    </nav>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<main id="main"></main>
<div id="modalRoot"></div>

<script src="config.js"></script>
<script src="vendor/supabase-2.116.0.js"></script>
<script>
(() => {
"use strict";

/* Genre colors from the Standalone Genres tab of "Books, Movies & Music Tracker" */
const PALETTE = [
  {name:"Young Adult", color:"#5E7E1E"},
  {name:"Fiction", color:"#8B7907"},
  {name:"MM Romance", color:"#9B1B2F"},
  {name:"MM Sports Romance", color:"#14469F"},
  {name:"MM College Romance", color:"#AF790E"},
  {name:"MM Cowboy Romance", color:"#894910"},
  {name:"MM Workplace Romance", color:"#00796B"},
  {name:"MM Dark Romance", color:"#5E0A1A"},
  {name:"MM Fantasy Romance", color:"#6B2C91"},
  {name:"MM Holiday Romance", color:"#0A8047"}
];
const SHEET_ID = "1EMXaMuS2MEJMCFAkzwDazlnf9TjfQ0eJ_bkW1hjDtpc";
const SHEET_TAB = "TBR List";
const NEUTRAL = "#7A6A5A";
const STATUS = {tbr:"TBR", reading:"Reading", read:"Read", dnf:"DNF"};
const RULES = {genre:"Genre", trope:"Trope", burn:"Burn", ending:"Ending", status:"Status", manual:"Hand-picked"};
const SHEET_FIELDS = ["title","author","pages","published","pov","seriesName","seriesCount","genre","tropes","ending","burn"];
const PAGE = 240;

let db=null, assets=null, downloads=null, mcp=null;
let catalog=new Map(), userDocs=new Map(), shelves=[], meta=null;
let catalogLoaded=false, userLoaded=false;
let ALL=[], allDirty=true;
const ui={hideEmpty:true, filter:"all", search:"", sort:"author", limit:PAGE, caseSearch:"", caseSort:"author", caseLimit:PAGE, listLimit:200};
const synCache=new Map();
const main=document.getElementById("main");
const syncEl=document.getElementById("sync");

/* ---------- helpers ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>(" "+String(s||"").toLowerCase()+" ").replace(/\bya\b/g,"young adult").replace(/\s+/g," ").trim();
const blob=id=>!id?"":/^https?:\/\//i.test(id)?id:photoURL(id);
const clean=v=>{const s=String(v??"").trim();return (!s||s.toUpperCase()==="N/A"||s==="Unknown")?"":s;};
const splitList=s=>String(s||"").split(/[,;\n]/).map(x=>x.trim()).filter(x=>x&&x.toUpperCase()!=="N/A");
const slug=s=>String(s||"").toLowerCase().normalize("NFKD").replace(/[^\w\s-]/g,"").trim().replace(/[\s_]+/g,"-").replace(/-+/g,"-").slice(0,60)||"x";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function genreColor(genre){
  const g=norm(genre); if(!g) return NEUTRAL;
  const rank=p=>p.name.startsWith("MM")?100+p.name.length:p.name.length;
  const hit=[...PALETTE].sort((a,b)=>rank(b)-rank(a)).find(p=>g.includes(norm(p.name))||(p.name==="MM Workplace Romance"&&g.includes("mm work romance")));
  return hit?hit.color:NEUTRAL;
}
function matches(shelf,b){
  const v=norm(shelf.value);
  switch(shelf.type){
    case "genre": return !!v && (norm(b.genre).includes(v) || (v==="mm workplace romance" && norm(b.genre).includes("mm work romance")));
    case "trope": return (b.tropes||[]).some(t=>norm(t)===v);
    case "burn": return norm(b.burn)===v;
    case "ending": return norm(b.ending)===v;
    case "status": return b.status===shelf.value;
    case "manual": return (b.shelves||[]).includes(shelf.id);
  }
  return false;
}
const lastName=a=>{const p=String(a||"").split("&")[0].trim().split(/\s+/);return (p[p.length-1]||"").toLowerCase();};
const SORTS={
  author:(a,b)=>lastName(a.author).localeCompare(lastName(b.author))||String(a.title).localeCompare(String(b.title)),
  title:(a,b)=>String(a.title).replace(/^the\s+/i,"").localeCompare(String(b.title).replace(/^the\s+/i,"")),
  genre:(a,b)=>String(a.genre).localeCompare(String(b.genre))||SORTS.author(a,b),
  sheet:(a,b)=>(a.row??1e9)-(b.row??1e9),
  pages:(a,b)=>(Number(a.pages)||0)-(Number(b.pages)||0)
};
function fmtDate(d){ if(!d) return ""; const t=new Date(d+"T12:00:00"); return isNaN(t)?d:t.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); }
function starPts(cx,cy,R,r){const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const rad=i%2?r:R;p.push([cx+Math.cos(a)*rad,cy+Math.sin(a)*rad]);}return p;}
function starsSVG(v,size=18,on="#E8C77E",off="#4b3f33"){
  const w=size*5+16, uid="s"+Math.random().toString(36).slice(2,8);
  let paths="";
  for(let i=0;i<5;i++){const cx=i*(size+4)+size/2;paths+=`<polygon points="${starPts(cx,size/2,size/2,size/4.6).map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ")}"/>`;}
  const full=Math.floor(v), frac=v-full, fillW=full*(size+4)+frac*size;
  return `<svg width="${w}" height="${size}" viewBox="0 0 ${w} ${size}" role="img" aria-label="${v} out of 5 stars"><g fill="${off}">${paths}</g><clipPath id="${uid}"><rect width="${fillW}" height="${size}"/></clipPath><g fill="${on}" clip-path="url(#${uid})">${paths}</g></svg>`;
}

/* ---------- data model ----------
   catalog/<chunk>   books imported from the sheet (compact keys)
   synopses/<chunk>  their synopses, read when a book is opened
   books/<id>        everything Geno adds in the app: status, rating, review, photos, edits, and books not in the sheet */
function expand(id,c){
  return {id,fromSheet:true,row:c.row,chunk:c.k,title:c.t||"",author:c.a||"",pages:c.p||null,published:c.d||"",pov:c.v||"",
    seriesName:c.n||"",seriesCount:c.s||"",genre:c.g||"",tropes:c.tr||[],ending:c.e||"",burn:c.b||"",status:c.r?"read":"tbr",sheetRead:!!c.r,coverId:c.cv||undefined};
}
function rebuild(){
  const out=new Map();
  for(const [id,c] of catalog) out.set(id,expand(id,c));
  for(const [id,u] of userDocs){ const base=out.get(id)||{id,fromSheet:false,tropes:[]}; out.set(id,{...base,...u,id}); }
  ALL=[...out.values()].filter(b=>!b.hidden && b.title).map(b=>applyAuto("book",b));
  allDirty=false;
}
function books(){ if(allDirty) rebuild(); return ALL; }
function getBook(id){ return books().find(b=>b.id===id); }

function setSync(t){syncEl.textContent=t;}
async function withRetry(fn){
  for(let i=0;;i++){ try{ return await fn(); }catch(e){ if(i<3&&e&&(e.code==="resource_exhausted"||e.code==="unavailable")){ await sleep(1200*(i+1)+Math.random()*400); continue; } throw e; } }
}

/* Save the app-side layer for a book: only fields that differ from the sheet, plus personal fields */
async function saveUser(id,full,isSheet){
  if(!db) throw new Error("Saving isn't available in this view.");
  const base=isSheet&&catalog.has(id)?expand(id,catalog.get(id)):null;
  if(full.coverId&&full.coverId===autoCovers.get("book:"+id)) delete full.coverId;
  if(base&&full.coverId&&full.coverId===base.coverId) delete full.coverId;
  const out={};
  for(const [k,v] of Object.entries(full)){
    if(v===undefined) continue;
    if(base&&SHEET_FIELDS.includes(k)&&JSON.stringify(base[k]??"")===JSON.stringify(v??"")) continue;
    if(base&&k==="status"&&base.status===v&&!(userDocs.get(id)||{}).status) continue;
    out[k]=v;
  }
  await withRetry(()=>db.collection("books").doc(id).set(out));
}
async function patchUser(id,fields){
  const cur={...(userDocs.get(id)||{})}; Object.assign(cur,fields);
  await withRetry(()=>db.collection("books").doc(id).set(cur));
}

/* ---------- routing ---------- */
function view(){const h=location.hash.slice(1); if(h.startsWith("case-")) return "case"; return ["tbr","shelves","read","books","watch","watched","listen","listened","settings"].includes(h)?h:"tbr";}
const ROOM_TABS={books:[["tbr","Main Shelf"],["shelves","Shelves"],["read","Read & Reviewed"],["books","All Books"]],watch:[["watch","VHS Shelf"],["watched","Watched & Reviewed"]],listen:[["listen","Record Wall"],["listened","Listened & Rated"]]};
const roomOf=v=>["watch","watched"].includes(v)?"watch":["listen","listened"].includes(v)?"listen":"books";
const lastView={books:"tbr",watch:"watch",listen:"listen"};
document.querySelectorAll(".room").forEach(r=>r.addEventListener("click",()=>{location.hash=lastView[r.dataset.room];}));
document.getElementById("tabs").addEventListener("click",e=>{const t=e.target.closest(".tab"); if(t) location.hash=t.dataset.view;});
window.addEventListener("hashchange",()=>{ui.caseLimit=PAGE;ui.caseSearch="";render();window.scrollTo(0,0);});
document.getElementById("addBook").addEventListener("click",()=>{const r=roomOf(view()); if(r==="watch") openWatchEdit(null); else if(r==="listen") openAlbumEdit(null); else openEdit(null);});

function render(){
  if(!UID){ if(document.body.dataset.room!=="auth") main.innerHTML=`<p class="hidden-note">Opening your library…</p>`; return; }
  const v=view(), room=roomOf(v); if(v!=="settings") lastView[room]=v;
  document.querySelectorAll(".room").forEach(r=>r.setAttribute("aria-current",r.dataset.room===room?"page":"false"));
  document.getElementById("tabs").innerHTML=ROOM_TABS[room].map(([k,l])=>`<button class="tab" type="button" data-view="${k}" aria-current="${(k===v||(v==="case"&&k==="shelves"))?"page":"false"}">${esc(l)}</button>`).join("");
  document.getElementById("addBook").textContent={books:"+ Add book",watch:"+ Add title",listen:"+ Add album"}[room];
  document.body.dataset.room=room;
  if(v==="settings"){ main.innerHTML=renderSettings(); wire(); wireSettings(); return; }
  let html="";
  if(!db && catalogLoaded) html+=`<div class="banner">This view can't save to your library. Open the app from its claude.ai link while signed in, and changes will sync between your computer and phone.</div>`;
  if(!catalogLoaded||!userLoaded){ main.innerHTML=html+`<p class="hidden-note">Opening your library…</p>`; return; }
  if(room==="watch"){
    if(db&&wLoaded&&!wcat.size) html+=`<div class="banner"><span>${(SETTINGS.sheets||{}).tbw?"Your watch list couldn't be read. Check its link in Settings.":"Add your TBW List link in Settings to fill the VHS shelf."}</span><a class="btn primary small" href="#settings">Open Settings</a></div>`;
    html+= v==="watched"?renderWatched():renderWatchShelf();
  }else if(room==="listen"){
    if(db&&lLoaded&&!lcat.size) html+=`<div class="banner"><span>${(SETTINGS.sheets||{}).albums?"Your albums couldn't be read. Check the link in Settings.":"Add your Albums to Listen To link in Settings to fill the record wall."}</span><a class="btn primary small" href="#settings">Open Settings</a></div>`;
    html+= v==="listened"?renderListened():renderRecordWall();
  }else{
  if(db && !catalog.size) html+=`<div class="banner"><span>${(SETTINGS.sheets||{}).tbr?"Your TBR List couldn't be read. Check its link in Settings.":"Add your TBR List link in Settings to fill the Main Shelf."}</span><a class="btn primary small" href="#settings">Open Settings</a></div>`;
  html+= v==="tbr"?renderMain() : v==="shelves"?renderShelves() : v==="case"?renderCase() : v==="read"?renderRead() : renderBooks();
  }
  main.innerHTML=html;
  wire();
}

/* ---------- spines ---------- */
function spineHTML(b){
  const pages=Number(b.pages)||320;
  const badge=b.status==="reading"?`<span class="badge" title="Currently reading"></span>`:"";
  const label=`${esc(b.title)}${b.author?" by "+esc(b.author):""}`;
  if(b.spineId){
    const ratio=Number(b.spineRatio)||0.14;
    return `<button class="spine" type="button" data-open="${esc(b.id)}" style="width:calc(var(--h) * ${ratio.toFixed(4)});min-width:12px;max-width:90px" aria-label="${label}" title="${label}"><img src="${blob(b.spineId)}" alt="" loading="lazy">${badge}</button>`;
  }
  const w=Math.max(24,Math.min(54,Math.round(pages/9)));
  let h=0; for(const ch of String(b.id)) h=(h*31+ch.charCodeAt(0))>>>0;
  const shadeMix=[0,8,16,-8,-14][h%5], sg=shadeMix>0?`color-mix(in srgb,${genreColor(b.genre)} ${100-shadeMix}%,#fff)`:shadeMix<0?`color-mix(in srgb,${genreColor(b.genre)} ${100+shadeMix}%,#000)`:genreColor(b.genre);
  return `<button class="spine blank b${(h>>3)%4}" type="button" data-open="${esc(b.id)}" style="width:${w}px;--g:${genreColor(b.genre)};--sg:${sg}" aria-label="${label}" title="${label}"><span class="t">${esc(b.title)}</span><span class="a">${esc(lastName(b.author))}</span>${badge}</button>`;
}
function filterSearch(list,q){ q=norm(q); return q?list.filter(b=>norm(b.title+" "+b.author+" "+b.genre+" "+(b.tropes||[]).join(" ")+" "+b.seriesName).includes(q)):list; }
function sortSelect(id,val){ return `<select class="sel" id="${id}" aria-label="Sort books">${[["author","Author"],["title","Title"],["genre","Genre"],["sheet","Sheet order"],["pages","Page count"]].map(([k,l])=>`<option value="${k}" ${val===k?"selected":""}>Sort: ${l}</option>`).join("")}</select>`; }

/* ---------- genre / trope shelves ---------- */
function ruleText(s){ return s.type==="manual"?"Hand-picked":`${RULES[s.type]||""} · ${esc(s.type==="status"?STATUS[s.value]:s.value)}`; }
function renderShelves(){
  const all=books();
  const list=[...shelves].sort((a,b)=>(a.order??99)-(b.order??99)||String(a.name).localeCompare(b.name));
  let hidden=0, out="";
  for(const s of list){
    const inShelf=all.filter(b=>matches(s,b)).sort(SORTS.author);
    if(ui.hideEmpty && !inShelf.length){hidden++;continue;}
    const prev=inShelf.slice(0,40);
    out+=`<section class="shelf" style="--c:${esc(s.color||NEUTRAL)}">
      <div class="shelf-head"><h2 class="plaque">${esc(s.name)}</h2><span class="rule">${ruleText(s)}</span><span class="count">${inShelf.length.toLocaleString()} ${inShelf.length===1?"book":"books"}</span>
      <span class="right">${inShelf.length?`<a class="btn ghost small" href="#case-${esc(s.id)}">Open shelf</a>`:""}<button class="btn ghost small" type="button" data-editshelf="${esc(s.id)}">Edit</button></span></div>
      <div class="niche">${inShelf.length?prev.map(spineHTML).join("")+(inShelf.length>prev.length?`<a class="seeall" href="#case-${esc(s.id)}">See all ${inShelf.length.toLocaleString()}</a>`:""):`<p class="empty-shelf">No books match this shelf yet.</p>`}</div>

function renderCase(){

  const inShelf=books().filter(b=>matches(s,b));

/* ---------- read ---------- */
function renderRead(){
  const read=books().filter(b=>b.status==="read").sort((a,b)=>String(b.finished||"").localeCompare(String(a.finished||""))||SORTS.author(a,b));
  queueCovers("book",read.slice(0,ui.listLimit));
  const yr=String(new Date().getFullYear());
  const thisYear=read.filter(b=>String(b.finished||"").startsWith(yr));
  const rated=read.filter(b=>Number(b.rating)>0);
  const avg=rated.length?rated.reduce((s,b)=>s+Number(b.rating),0)/rated.length:0;
  const pages=thisYear.reduce((s,b)=>s+(Number(b.pages)||0),0);
  let out=`<div class="view-head"><h1>Read &amp; Reviewed</h1></div>
  <div class="stats">
    <div class="stat"><b>${thisYear.length}</b><span>books finished in ${yr}</span></div>
    <div class="stat"><b>${pages.toLocaleString()}</b><span>pages read in ${yr}</span></div>
    <div class="stat"><b>${avg?avg.toFixed(2):"–"}</b><span>average rating</span></div>
    <div class="stat"><b>${read.length.toLocaleString()}</b><span>books read in all</span></div>
  </div>`;
  if(!read.length) return out+`<div class="empty"><h2>Nothing marked read yet</h2><p>Open any book and mark it Read, then add your rating and review. It shows up here, ready to turn into a Bookstagram post.</p></div>`;
  out+=`<div class="reviews">`+read.slice(0,ui.listLimit).map(b=>{
    const c=genreColor(b.genre);
    const img=b.coverId?`<img src="${blob(b.coverId)}" alt="">`:esc(b.title);
    return `<article class="rcard" style="--c:${c}"><button class="thumb" type="button" data-open="${esc(b.id)}" aria-label="Open ${esc(b.title)}">${img}</button><div>
      <h3>${esc(b.title)}</h3><p class="by">${esc(b.author)}</p>
      ${Number(b.rating)>0?starsSVG(Number(b.rating)):`<span class="meta">Not rated yet</span>`}
      <p class="rev">${b.review?esc(b.review):"<span class='meta'>No review yet.</span>"}</p>
      <p class="meta">${b.finished?"Finished "+esc(fmtDate(b.finished)):""}${b.genre?(b.finished?" · ":"")+esc(b.genre):""}</p>
      <div class="row" style="margin-top:10px"><button class="btn small primary" type="button" data-post="${esc(b.id)}">Bookstagram post</button><button class="btn small" type="button" data-edit="${esc(b.id)}">${b.review?"Edit review":"Rate &amp; review"}</button></div>
    </div></article>`;
  }).join("")+`</div>`;
  if(read.length>ui.listLimit) out+=`<div class="more"><button class="btn" type="button" id="more-list">Show more</button></div>`;
  return out;
}

  on("[data-lgroup]",el=>{lui.open.add(el.dataset.lgroup);render();});

  if(g("s-case")) g("s-case").addEventListener("change",e=>{ui.caseSort=e.target.value;render();});
  [["w-genre","genre"],["w-where","where"],["w-group","group"],["w-sort","sort"]].forEach(([id,k])=>{ if(g(id)) g(id).addEventListener("change",e=>{wui[k]=e.target.value;wui.limit=PAGE;render();}); });
  [["l-genre","genre"],["l-sort","sort"]].forEach(([id,k])=>{ if(g(id)) g(id).addEventListener("change",e=>{lui[k]=e.target.value;render();}); });
  if(g("more-watch")) g("more-watch").addEventListener("click",()=>{wui.limit+=PAGE;render();});
  const live=(id,key,reset)=>{ const el=g(id); if(!el) return; let t; el.addEventListener("input",()=>{ clearTimeout(t); t=setTimeout(()=>{ ui[key]=el.value; ui[reset]=reset==="listLimit"?200:PAGE; const pos=el.selectionStart; render(); const n=g(id); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} },180); }); };
  live("q-main","search","limit"); live("q-books","search","listLimit"); live("q-case","caseSearch","caseLimit");
  const live2=(id,obj,key)=>{ const el=g(id); if(!el) return; let t; el.addEventListener("input",()=>{ clearTimeout(t); t=setTimeout(()=>{ obj[key]=el.value; const pos=el.selectionStart; render(); const n=g(id); n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} },180); }); };
  live2("q-watch",wui,"search"); live2("q-listen",lui,"search");
}

/* ---------- modal plumbing ---------- */
const root=document.getElementById("modalRoot");
let lastFocus=null;
function modal(html){
  lastFocus=document.activeElement;
  root.innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const ov=document.getElementById("ov");
  ov.addEventListener("click",e=>{if(e.target===ov)close();});
  document.addEventListener("keydown",escKey);
  const first=ov.querySelector("[data-autofocus]")||ov.querySelector("input,select,textarea,button"); if(first) first.focus();
  return ov;
}
function escKey(e){if(e.key==="Escape")close();}
function close(){root.innerHTML="";document.removeEventListener("keydown",escKey);if(lastFocus&&document.contains(lastFocus))lastFocus.focus();}

/* ---------- image prep ---------- */
async function prepImage(file,rotate,max=1600){
  const bmp=await createImageBitmap(file);
  let w=bmp.width,h=bmp.height; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
  const c=document.createElement("canvas"); const r=((rotate%360)+360)%360;
  if(r===90||r===270){c.width=h;c.height=w;}else{c.width=w;c.height=h;}
  const x=c.getContext("2d"); x.translate(c.width/2,c.height/2); x.rotate(r*Math.PI/180); x.drawImage(bmp,-w/2,-h/2,w,h);
  const out=await new Promise(res=>c.toBlob(res,"image/jpeg",0.88));
  return {blob:out, ratio:c.width/c.height, preview:c.toDataURL("image/jpeg",0.6)};
}

/* ---------- pick my next read ---------- */
const recentPicks=[];
function openPicker(shelfId){
  const tbrAll=books().filter(b=>b.status==="tbr");
  const genres=[...new Set(tbrAll.map(b=>b.genre).filter(Boolean))].sort();
  const tropes=[...new Set(tbrAll.flatMap(b=>b.tropes||[]))].sort();
  const shelfOpts=[...shelves].sort((a,b)=>(a.order??99)-(b.order??99)).map(s=>`<option value="${esc(s.id)}" ${s.id===shelfId?"selected":""}>${esc(s.name)}</option>`).join("");
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ov=modal(`<h2>Pick my next read</h2>
    <div class="picker-filters">
      <label class="f">Pull from<select id="p-src"><option value="">Main Shelf (all TBR)</option>${shelfOpts}</select></label>
      <label class="f">Genre<select id="p-genre"><option value="">Any genre</option>${genres.map(g=>`<option>${esc(g)}</option>`).join("")}</select></label>
      <label class="f">Trope<input id="p-trope" list="dl-ptrope" placeholder="Any trope"><datalist id="dl-ptrope">${tropes.map(t=>`<option value="${esc(t)}">`).join("")}</datalist></label>
      <label class="f">HEA / HFN<select id="p-ending"><option value="">Either</option><option>HEA</option><option>HFN</option></select></label>
      <label class="f">Burn pace<select id="p-burn"><option value="">Either</option><option>Slow Burn</option><option>Fast Burn</option></select></label>
      <label class="f">Max pages<input id="p-pages" inputmode="numeric" placeholder="No limit"></label>
    </div>
    <p class="hat" id="hat"></p>
    <div class="stage" id="stage" aria-hidden="true"></div><div class="stage-ledge"></div>
    <div id="result" aria-live="polite"></div>
    <div class="foot"><span class="err" id="err"></span><button class="btn ghost" type="button" id="cancel">Close</button><button class="btn primary" type="button" id="go" data-autofocus>Pull a book</button></div>`);
  const $=s=>ov.querySelector(s);
  let pool=[], spinning=false;
  function computePool(){
    const src=$("#p-src").value, s=shelves.find(x=>x.id===src);
    const g=$("#p-genre").value, t=norm($("#p-trope").value), e=$("#p-ending").value, bu=$("#p-burn").value, mp=parseInt($("#p-pages").value,10);
    pool=tbrAll.filter(b=>(!s||matches(s,b))&&(!g||b.genre===g)&&(!t||(b.tropes||[]).some(x=>norm(x).includes(t)))&&(!e||b.ending===e)&&(!bu||b.burn===bu)&&(!mp||(Number(b.pages)||0)<=mp));
    $("#hat").textContent=pool.length?`${pool.length.toLocaleString()} ${pool.length===1?"book":"books"} on the shelf to pick from`:"No TBR books match these choices. Loosen a filter.";
    $("#go").disabled=!pool.length;
    drawStage();
  }
  function sample(arr,n){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a.slice(0,n); }
  function drawStage(winner){
    const n=window.innerWidth<640?9:16;
    let row=sample(pool.filter(b=>!winner||b.id!==winner.id),winner?n-1:n);
    if(winner) row.splice(Math.floor(row.length/2),0,winner);
    $("#stage").innerHTML=row.length?row.map(spineHTML).join(""):`<p class="stage-empty">The shelf is empty for this mix.</p>`;
    return [...$("#stage").querySelectorAll(".spine")];
  }
  async function pull(){
    if(spinning||!pool.length) return;
    spinning=true; $("#go").disabled=true; $("#result").innerHTML="";
    let choices=pool.filter(b=>!recentPicks.includes(b.id)); if(!choices.length) choices=pool;
    const winner=choices[Math.floor(Math.random()*choices.length)];
    recentPicks.push(winner.id); if(recentPicks.length>10) recentPicks.shift();
    const spines=drawStage(winner);
    const wi=spines.findIndex(el=>el.dataset.open===winner.id);
    if(!reduce){
      let delay=50, i=0;
      const total=17+Math.floor(Math.random()*5);
      for(let step=0;step<total;step++){
        spines.forEach(el=>el.classList.remove("lit"));
        i=step===total-1?wi:Math.floor(Math.random()*spines.length);
        spines[i].classList.add("lit");
        await sleep(delay); delay*=1.08;
      }
    }
    spines.forEach((el,k)=>{el.classList.remove("lit");el.classList.add(k===wi?"pulled":"dim");});
    await sleep(reduce?0:450);
    showPick(winner);
    spinning=false; $("#go").disabled=false; $("#go").textContent="Pull another";
  }
  async function showPick(b){
    const c=genreColor(b.genre);
    const cover=b.coverId?`<img src="${blob(b.coverId)}" alt="Cover of ${esc(b.title)}">`:`<span class="ct">${esc(b.title)}</span><span class="ca">${esc(b.author)}</span>`;
    const bits=[b.genre,b.pages?Number(b.pages).toLocaleString()+" pages":"",b.ending,b.burn].filter(Boolean).map(esc).join(" · ");
    $("#result").innerHTML=`<div class="pick" style="--c:${c}"><div class="cover">${cover}</div><div>
      <span class="eyebrow">Your next read</span><h3>${esc(b.title)}</h3><p class="line">${esc(b.author)}</p>
      ${bits?`<p class="line">${bits}</p>`:""}
      ${b.seriesName?`<p class="line">${esc(b.seriesName)}${b.seriesCount?` · ${esc(b.seriesCount)} books`:""}</p>`:""}
      ${(b.tropes||[]).length?`<span class="tchips">${b.tropes.map(t=>`<span class="tchip">${esc(t)}</span>`).join("")}</span>`:""}
      <p class="syn" id="psyn"></p>
      <div class="row" style="margin-top:12px"><button class="btn primary small" type="button" id="p-start">Start reading</button><button class="btn small" type="button" id="p-open">See full details</button></div>
    </div></div>`;
    synopsisFor(b).then(t=>{const el=$("#psyn"); if(el) el.textContent=t||"";});
    $("#p-open").addEventListener("click",()=>openDetail(b.id));
    $("#p-start").addEventListener("click",async()=>{
      try{ await patchUser(b.id,{status:"reading",started:b.started||new Date().toISOString().slice(0,10)}); $("#p-start").textContent="Started"; $("#p-start").disabled=true; }
      catch(e){ $("#err").textContent=db?"Couldn't save. Check your connection and try again.":"Saving isn't available in this view."; }
    });
  }
  ["#p-src","#p-genre","#p-ending","#p-burn"].forEach(s=>$(s).addEventListener("change",computePool));
  ["#p-trope","#p-pages"].forEach(s=>$(s).addEventListener("input",computePool));
  $("#go").addEventListener("click",pull);
  $("#cancel").addEventListener("click",close);
  computePool();
}

/* ---------- Bookstagram post ---------- */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin="anonymous";i.referrerPolicy="no-referrer";i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
function wrapLines(x,text,maxW){const words=String(text).split(/\s+/);const lines=[];let line="";for(const w of words){const t=line?line+" "+w:w;if(x.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;}if(line)lines.push(line);return lines;}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));return `rgb(${f(n>>16)},${f((n>>8)&255)},${f(n&255)})`;}
function caption(b){
  const r=Number(b.rating)||0;
  const stars=r?("★".repeat(Math.floor(r))+(r%1>=0.5?"½":"")+` (${r}/5)`):"";
  const tags=["#genoslibrary","#bookstagram","#bookreview"]; const g=norm(b.genre);
  if(g.includes("mm")) tags.push("#mmromance","#queerbooks");
  if(g.includes("young adult")) tags.push("#yabooks");
  if(g.includes("sports")) tags.push("#sportsromance");
  if(g.includes("dark")) tags.push("#darkromance");
  if(g.includes("fantasy")) tags.push("#fantasyromance");
  (b.tropes||[]).slice(0,3).forEach(t=>tags.push("#"+t.toLowerCase().replace(/[^a-z0-9]/g,"")));
  const parts=[`${b.title}${b.author?" by "+b.author:""}`];
  if(stars) parts.push(stars);
  if(b.review) parts.push("",b.review);
  const facts=[]; if((b.tropes||[]).length) facts.push("Tropes: "+b.tropes.join(", ")); if(b.ending) facts.push(b.ending); if(b.burn) facts.push(b.burn);
  if(facts.length) parts.push("",facts.join(" · "));
  parts.push("",[...new Set(tags)].join(" "));
  return parts.join("\n");
}
async function drawPost(c,b){
  const W=1080,H=1350; c.width=W; c.height=H; const x=c.getContext("2d");
  const col=genreColor(b.genre);
  try{ await Promise.all([document.fonts.load('70px "Gloock"'),document.fonts.load('600 30px "Figtree"')]); }catch(_){}
  const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,shade(col,0.12)); g.addColorStop(1,shade(col,-0.55)); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle="rgba(255,255,255,.85)"; x.font='600 26px "Figtree", sans-serif'; x.textAlign="center";
  x.fillText("G E N O ' S   L I B R A R Y",W/2,80);
  let img=null; try{ if(b.coverId) img=await loadImg(blob(b.coverId)); else if(b.spineId) img=await loadImg(blob(b.spineId)); }catch(_){ img=null; }
  const boxH=620, top=120;
  if(img){
    const s=Math.min(560/img.width,boxH/img.height); const w=img.width*s,h=img.height*s; const ix=(W-w)/2, iy=top+(boxH-h)/2;
    x.save(); x.shadowColor="rgba(0,0,0,.5)"; x.shadowBlur=40; x.shadowOffsetY=18; x.fillStyle="#000"; x.fillRect(ix,iy,w,h); x.restore();
    x.drawImage(img,ix,iy,w,h);
  }else{
    const w=410,ix=(W-w)/2; x.fillStyle=shade(col,-0.3); x.fillRect(ix,top,w,boxH); x.fillStyle="#fff"; x.font='54px "Gloock", serif';
    wrapLines(x,b.title,w-60).slice(0,5).forEach((l,i)=>x.fillText(l,W/2,top+200+i*64));
  }
  let y=top+boxH+90;
  x.fillStyle="#fff"; x.font='68px "Gloock", serif';
  wrapLines(x,b.title,W-140).slice(0,2).forEach(l=>{x.fillText(l,W/2,y);y+=76;});
  x.font='500 34px "Figtree", sans-serif'; x.fillStyle="rgba(255,255,255,.85)"; if(b.author) x.fillText(b.author,W/2,y); y+=70;
  const r=Number(b.rating)||0;
  if(r){
    const size=64,gap=18,total=size*5+gap*4; let sx=(W-total)/2;
    for(let i=0;i<5;i++){
      const path=new Path2D(); starPts(sx+size/2,y,size/2,size/4.6).forEach((p,j)=>j?path.lineTo(p[0],p[1]):path.moveTo(p[0],p[1])); path.closePath();
      x.fillStyle="rgba(255,255,255,.25)"; x.fill(path);
      const fill=Math.max(0,Math.min(1,r-i)); if(fill>0){x.save();x.beginPath();x.rect(sx,y-size/2,size*fill,size);x.clip();x.fillStyle="#F3D99A";x.fill(path);x.restore();}
      sx+=size+gap;
    }
    y+=70; x.font='600 30px "Figtree", sans-serif'; x.fillStyle="#fff"; x.fillText(`${r} / 5`,W/2,y); y+=56;
  }
  const facts=[...(b.tropes||[]).slice(0,3)]; if(b.ending) facts.push(b.ending); if(b.burn) facts.push(b.burn);

async function saveLayer(col,id,data,base,prevMap){

function starInput(ov,init){

  draw();
  sb.addEventListener("click",e=>{const r=sb.getBoundingClientRect();const step=32;const x=e.clientX-r.left;const i=Math.max(0,Math.min(4,Math.floor(x/step)));rating=i+((x-i*step)<14?0.5:1);draw();});
  sb.addEventListener("keydown",e=>{if(["ArrowRight","ArrowUp"].includes(e.key)){rating=Math.min(5,rating+0.25);draw();e.preventDefault();}if(["ArrowLeft","ArrowDown"].includes(e.key)){rating=Math.max(0,rating-0.25);draw();e.preventDefault();}});

}

const STOP=new Set(["the","a","an","and","of","by","to","in","on","for","jpg","jpeg","png","webp","heic","copy","spine","cover","poster","album","art","front","img","image","photo","vhs","final","edited"]);
const toks=s=>String(s||"").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(w=>w&&!STOP.has(w)&&!/^\d{1,2}$/.test(w));
function cleanName(fn){ return String(fn).replace(/\.[a-z0-9]{2,5}$/i,"").replace(/[_]+/g," ").replace(/\(\d+\)|\bcopy\b/gi," ").trim(); }
function matchScore(fileToks,fileKey,item,creator){
  const t=nkey(item.title), tc=nkey(item.title+(creator||"")), ct=nkey((creator||"")+item.title);
  if(!t) return 0;
  if(fileKey===t||fileKey===tc||fileKey===ct) return 1;
  let best=0;
  if(t.length>=4&&fileKey.includes(t)) best=0.82+0.15*(t.length/fileKey.length);
  const it=new Set(toks(item.title)), ic=new Set(toks(creator)); const ft=new Set(fileToks);
  if(it.size){ let hit=0; it.forEach(w=>{if(ft.has(w))hit++;}); let extra=0; ft.forEach(w=>{ if(!it.has(w)&&!ic.has(w)) extra++; });
    const j=hit/(it.size+extra); best=Math.max(best,j*0.9); }
  return Math.min(1,best);
}

  books:{label:"books",kinds:[["cover","Covers"]],items:()=>books(),creator:b=>b.author,

    rows.forEach((r,i)=>{ const u=URL.createObjectURL(r.file); const el=$("#bt-"+i); if(el) el.innerHTML=`<img src="${u}" alt="">`; });

/* ---------- reading the published sheet (CSV) ---------- */
function parseCSV(text){
  const rows = []; let row = [], field = "", i = 0, q = false;
  while(i < text.length){
    const ch = text[i];
    if(q){
      if(ch === '"'){ if(text[i + 1] === '"'){ field += '"'; i += 2; continue; } q = false; i++; continue; }
      field += ch; i++; continue;
    }
    if(ch === '"'){ q = true; i++; continue; }
    if(ch === ","){ row.push(field); field = ""; i++; continue; }
    if(ch === "\r"){ i++; continue; }
    if(ch === "\n"){ row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
    field += ch; i++;
  }
  if(field !== "" || row.length){ row.push(field); rows.push(row); }
  return rows;
}
function colsFrom(header, spec){
  const head = header.map(h => String(h || "").trim().toLowerCase());
  const idx = {}; for(const [k, re] of Object.entries(spec)) idx[k] = head.findIndex(h => re.test(h));
  return (r, k) => idx[k] >= 0 ? (r[idx[k]] ?? "") : "";
}
async function fetchTab(key){
  const url = (SETTINGS.sheets || {})[key];
  if(!url) return null;
  const res = await fetch(url, { cache: "no-store" });
  if(!res.ok) throw new Error("http " + res.status);
  const text = await res.text();
  if(/^\s*</.test(text)) throw new Error("not csv");
  const rows = parseCSV(text);
  return { header: rows[0] || [], rows: rows.slice(1).map((r, i) => ({ r, row: i + 2 })) };
}
const isTrue = v => String(v).trim().toUpperCase() === "TRUE";
function buildBooks(tab){
  const col = colsFrom(tab.header, {read:/^read/,title:/^title/,author:/^author/,cover:/cover url|^cover$/,pages:/page/,pub:/publication/,pov:/^pov/,series:/^series$/,count:/how many/,sname:/name of series/,genre:/^genre/,tropes:/trope/,ending:/hea|hfn/,burn:/burn/,syn:/synopsis/});
  const seen = new Map(), cat = new Map(); synMap.clear();
  for(const { r, row } of tab.rows){
    const title = clean(col(r, "title")); if(!title) continue;
    const author = clean(col(r, "author"));
    let id = slug(title) + "--" + slug(author).slice(0, 40);
    const n = (seen.get(id) || 0) + 1; seen.set(id, n); if(n > 1) id += "-" + n;
    const pages = parseInt(String(col(r, "pages")).replace(/[^\d]/g, ""), 10) || null;
    const inSeries = /^y/i.test(String(col(r, "series")));

    cat.set(id, { t: title, a: author, p: pages, d: clean(col(r, "pub")), v: clean(col(r, "pov")), s: inSeries ? clean(col(r, "count")) : "", n: inSeries ? clean(col(r, "sname")) : "", g: clean(col(r, "genre")), tr: splitList(col(r, "tropes")), e: clean(col(r, "ending")), b: clean(col(r, "burn")), r: isTrue(col(r, "read")), cv: /^https?:\/\//i.test(cv) ? cv : "", row });
    const syn = String(col(r, "syn")).trim(); if(syn) synMap.set(id, syn);

/* ---------- automatic covers ---------- */
const sameTitle = (a, b) => { const x = nkey(a).replace(/^the/, ""), y = nkey(b).replace(/^the/, ""); return x && y && (x === y || x.startsWith(y) || y.startsWith(x)); };
async function gbooksCover(title, author){
  const q = `intitle:${title}` + (author ? ` inauthor:${author.split("&")[0].trim()}` : "");
  const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=5&printType=books`);
  if(res.status === 429) throw new Error("busy");
  if(!res.ok) return "";
  const j = await res.json();
  for(const v of (j.items || [])){
    const vi = v.volumeInfo || {}; const img = vi.imageLinks && (vi.imageLinks.thumbnail || vi.imageLinks.smallThumbnail);
    if(img && sameTitle(vi.title || "", title)) return img.replace(/^http:/, "https:").replace("&edge=curl", "");
  }
  return "";
}
async function olibCover(title, author){
  const res = await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(title)}${author ? "&author=" + encodeURIComponent(author.split("&")[0].trim()) : ""}&limit=5&fields=title,cover_i`);
  if(!res.ok) return "";
  const j = await res.json();
  const d = (j.docs || []).find(x => x.cover_i && sameTitle(x.title || "", title));
  return d ? `https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg` : "";
}
async function itunesCover(title, artist){
  const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent((artist ? artist + " " : "") + title)}&entity=album&limit=8`);
  if(!res.ok) return "";
  const j = await res.json();
  const hit = (j.results || []).find(x => sameTitle(x.collectionName || "", title)) || null;
  return hit && hit.artworkUrl100 ? hit.artworkUrl100.replace("100x100bb", "600x600bb") : "";
}
const coverInFlight = new Map();
async function findCover(kind, x){
  const key = kind + ":" + x.id;
  if(autoCovers.has(key)) return autoCovers.get(key);
  if(coverInFlight.has(key)) return coverInFlight.get(key);
  const p = (async () => {
    let url = "";
    try{
      if(kind === "book"){ url = await gbooksCover(x.title, x.author); if(!url) url = await olibCover(x.title, x.author); }
      else if(kind === "album"){ url = await itunesCover(x.title, x.artist); }
      else return "";
    }catch(_){ return null; }
    autoCovers.set(key, url);
    sb.from("covers").upsert({ user_id: UID, kind, item_id: x.id, url, checked_at: new Date().toISOString() }).then(() => {});
    markDirty();
    return url;
  })();

const coverQueue = []; let coverBusy = false, coverRenderTimer = null;
function queueCovers(kind, list){
  for(const x of list){ const key = kind + ":" + x.id; if(!x.coverId && !autoCovers.has(key) && !coverQueue.some(q => q.key === key)) coverQueue.push({ key, kind, x }); }
  runCoverQueue();
}
async function runCoverQueue(){
  if(coverBusy) return; coverBusy = true;
  while(coverQueue.length){
    const { kind, x } = coverQueue.shift();
    const url = await findCover(kind, x);
    if(url === null){ await sleep(4000); continue; }
    if(url){ clearTimeout(coverRenderTimer); coverRenderTimer = setTimeout(() => { if(!document.getElementById("ov")) render(); }, 700); }
    await sleep(350);
  }
  coverBusy = false;
}
function applyAuto(kind, x){
  if(!x.coverId && kind !== "watch"){ const a = autoCovers.get(kind + ":" + x.id); if(a) x.coverId = a; }
  return x;
}

/* ---------- account screens ---------- */
function showAuth(message){
  document.body.dataset.room = "auth";
  document.getElementById("tabs").innerHTML = "";
  main.innerHTML = `<section class="auth">
    <h1>Welcome to the library</h1>
    <p class="sub">Sign in to see your shelves on any device.</p>
    <form id="authForm" class="grid" novalidate>
      <label class="f full">Email<input id="a-email" type="email" autocomplete="email" required></label>
      <label class="f full">Password<input id="a-pass" type="password" autocomplete="current-password" minlength="6" required></label>
      <div class="full row"><button class="btn primary" type="submit" id="a-in">Sign in</button><button class="btn" type="button" id="a-up">Create account</button></div>
      <p class="err full" id="a-err">${esc(message || "")}</p>
    </form></section>`;
  setSync("");
  const $ = s => document.getElementById(s);
  const creds = () => ({ email: $("a-email").value.trim(), password: $("a-pass").value });
  $("authForm").addEventListener("submit", async e => {
    e.preventDefault(); $("a-err").textContent = "";
    const { error } = await sb.auth.signInWithPassword(creds());
    if(error) $("a-err").textContent = /confirm/i.test(error.message) ? "Confirm your email first, using the link Supabase sent you." : "That email and password didn't match. Try again.";
  });
  $("a-up").addEventListener("click", async () => {
    $("a-err").textContent = "";
    const c = creds();
    if(!c.email || c.password.length < 6){ $("a-err").textContent = "Enter your email and a password of at least 6 characters."; return; }
    const { data, error } = await sb.auth.signUp({ ...c, options: { emailRedirectTo: location.origin + location.pathname } });
    if(error){ $("a-err").textContent = error.message; return; }
    if(!data.session) $("a-err").textContent = "Check your email for a link to confirm your account, then come back and sign in.";
  });
}
function renderSettings(){
  const s = SETTINGS.sheets || {};
  return `<div class="view-head"><h1>Settings</h1></div>
  <section class="settings">
    <h2>Your sheet</h2>
    <p class="sub">In Google Sheets, open <b>File → Share → Publish to web</b>. Open <b>Published content &amp; settings</b>, choose the tabs below (or Entire document), and click <b>Publish</b>. Then, under <b>Link</b>, pick a tab, choose <b>Comma-separated values (.csv)</b>, and copy the link into its box here. Repeat for each tab. Leave a box empty if you don't track that list.</p>
    <form id="sheetForm" class="grid" novalidate>
      ${SHEET_TABS.map(([k, tab, help]) => `<label class="f full">${esc(tab)} <span class="hint">${esc(help)}</span><input id="s-${k}" type="url" placeholder="https://docs.google.com/spreadsheets/d/e/…/pub?gid=…&output=csv" value="${esc(s[k] || "")}"></label>`).join("")}
      <div class="full row"><button class="btn primary" type="submit">Save links</button><button class="btn" type="button" data-import>Refresh from sheet</button></div>
      <p class="err full" id="s-err">${sheetErrors.length ? "Couldn't read: " + esc(sheetErrors.join(", ")) + ". Check those links are published as CSV." : ""}</p>
    </form>
    <h2>Account</h2>
    <p class="sub">Signed in as <b>${esc(EMAIL)}</b></p>
    <div class="row"><button class="btn" type="button" id="signOut">Sign out</button></div>
  </section>`;
}
function wireSettings(){
  const f = document.getElementById("sheetForm"); if(!f) return;
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const sheets = {};
    for(const [k] of SHEET_TABS){
      let v = document.getElementById("s-" + k).value.trim();
      if(v && /\/pubhtml/.test(v)) v = v.replace("/pubhtml", "/pub").replace(/([?&])output=\w+/, "") + (v.includes("?") ? "&" : "?") + "output=csv";
      sheets[k] = v;
    }
    try{ await saveSettings({ ...SETTINGS, sheets }); toast("Links saved."); await loadSheets(); }
    catch(_){ document.getElementById("s-err").textContent = "Couldn't save. Check your connection and try again."; }
  });
  document.getElementById("signOut").addEventListener("click", async () => { await sb.auth.signOut(); location.hash = ""; location.reload(); });
}

/* ---------- start-up ---------- */
let started = false;
async function start(session){
  if(started) return; started = true;
  UID = session.user.id; EMAIL = session.user.email || "";
  db = makeDb(); assets = ASSETS;
  setSync("Opening your library…");
  try{ await loadUserData(); }
  catch(e){ setSync("Couldn't reach your library"); main.innerHTML = `<div class="empty"><h2>Couldn't open your library</h2><p>Check your connection and reload the page.</p></div>`; return; }
  userLoaded = true;
  await loadSheets();
  if(!(SETTINGS.sheets && Object.values(SETTINGS.sheets).some(Boolean)) && !location.hash) location.hash = "settings";
}
async function boot(){
  render();
  sb.auth.onAuthStateChange((event, session) => { if(session && !started) start(session); });
  const { data } = await sb.auth.getSession();
  if(data.session) start(data.session); else showAuth();
}
document.addEventListener("visibilitychange", async () => {
  if(document.visibilityState !== "visible" || !UID) return;
  if(Date.now() - lastSheetLoad > 2 * 60 * 1000){ try{ await loadUserData(); }catch(_){} await loadSheets(); }
});

boot();
})();
</script>
